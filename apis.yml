name: Parlia
description: >-
  Parlia is the "encyclopedia of opinion," a London-based collaborative content platform founded by
  Turi Munthe and J. Paul Neeley that maps the world's arguments and opinions the way Wikipedia maps
  facts. Launched in January 2020 from Somerset House Exchange, it lets a community document, compare,
  and debate perspectives across politics, technology, and culture in calm, descriptive language, and
  publishes the "On Opinion with Turi Munthe" podcast. Parlia is a consumer-facing web product; the
  enrichment pass found no public developer API, SDKs, or OpenAPI surface. It is tracked here as a
  Bloomberg Beta portfolio company.
